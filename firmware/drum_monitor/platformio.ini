[platformio]
src_dir = .

[env:esp32dev]
platform  = espressif32@6.5.0   ; arduino-esp32 2.0.x — lebih stabil untuk Wire/I2C
board     = esp32dev
framework = arduino

; Automatik detect port — uncomment dan isi jika tidak auto detect
; upload_port = /dev/ttyUSB0   ; Linux
; upload_port = COM3            ; Windows

upload_speed   = 460800
monitor_speed  = 115200

; DIO flash mode — lebih serasi dengan pelbagai ESP32 module (termasuk clone)
; QIO lebih laju tapi ada module yang tidak sokong
board_build.flash_mode = dio
board_build.flash_freq = 80m

lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0

[env:esp32dev_dual1115]
platform  = espressif32@6.5.0
board     = esp32dev
framework = arduino
upload_speed   = 460800
monitor_speed  = 115200
board_build.flash_mode = dio
board_build.flash_freq = 80m
build_flags = -DDUAL_ADS1115
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
